name: Suggest a feature
description: Something you'd like the console to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in your way today. A concrete example helps more than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Rough is fine.
  - type: input
    id: setup
    attributes:
      label: Your setup (optional)
      description: OS, Node version, how many seats, phone or desktop.
