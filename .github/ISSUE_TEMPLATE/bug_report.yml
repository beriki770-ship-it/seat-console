name: Report a bug
description: Something broke or behaves wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: input
    id: env
    attributes:
      label: OS, Node version, browser
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from console/server.log (remove anything private)
      render: text
