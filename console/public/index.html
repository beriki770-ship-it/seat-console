<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="seat-token" content="__TOKEN__">
<meta name="seat-build" content="__BUILD__">
<meta name="seat-https" content="__HTTPS__">
<title>Seat Console</title>
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="newver" role="status" hidden><span data-i18n="banner.newVersion">A new version of the console is running.</span> <button type="button" id="reloadbtn" data-i18n="banner.reload">Reload</button></div>
<div id="saveBanner" role="alert" data-i18n="banner.saveFailed" hidden>The console cannot save its state file. Conversations are kept in memory only: a restart now would lose what happened since the last good save.</div>
<aside data-sid="seat-list" data-title="Seats and their conversations">
  <!-- rail: the tools on top, then "All" and one ringed avatar per seat (app.js showRail); dark in both themes -->
  <nav id="rail" data-sid="rail" data-title="Rail: search, Projects, Guide, Settings, All and one avatar per seat" aria-label="Seats" data-i18n-aria-label="side.seats">
    <button type="button" id="qbtn" class="rb" aria-pressed="false" aria-label="Search conversations" title="Search conversations" data-i18n-aria-label="side.searchLabel" data-i18n-title="side.searchLabel"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg></button>
    <button type="button" id="projbtn" class="rb" data-guide="projects-open" aria-label="Open projects" title="Open projects" data-i18n-aria-label="projects.open" data-i18n-title="projects.open"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg><span class="rbadge" hidden></span></button>
    <button type="button" id="guidebtn" class="rb" aria-label="Guide" data-i18n-aria-label="guide.button" data-i18n-title="guide.buttonTitle" title="How to use the console"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.4"/><circle cx="8" cy="11.6" r=".5"/></svg></button>
    <button type="button" id="setbtn" class="rb" data-guide="settings" aria-label="Settings" data-i18n-aria-label="set.title" data-i18n-title="side.settingsTitle" title="Settings: seats, Telegram, phone access, features"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6 5 5M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg></button>
    <hr>
    <button type="button" id="foldall" class="av all" data-guide="foldall" aria-pressed="false" data-i18n-title="side.foldAllTitle" title="Fold or expand every seat's conversation list"><span class="ini" data-i18n="side.all">All</span></button>
    <div id="avs"></div>
  </nav>
  <div id="panel">
    <div id="sidetop">
      <div class="ahead"><h1>Seat Console</h1><button type="button" id="needsum" aria-expanded="false" aria-controls="needpop" hidden></button>
        <div id="needpop" role="dialog" aria-label="Conversations that need you" data-i18n-aria-label="side.needList" hidden></div>
        <div id="qbox" data-guide="search"><svg class="qicon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="q" type="search" dir="auto" placeholder="Search all conversations (archived too)" aria-label="Search conversations" data-i18n-placeholder="side.searchPh" data-i18n-aria-label="side.searchLabel" autocomplete="off" spellcheck="false"><button type="button" id="qclear" aria-label="Clear search" title="Clear search" data-i18n-aria-label="side.searchClear" data-i18n-title="side.searchClear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      </div>
      <section id="multi" data-sid="multi" data-title="Projects still running, one slim line each (the Projects button is on the rail)"></section>
    </div>
    <div id="sidescroll">
      <nav id="results" aria-live="polite" hidden></nav>
      <nav id="seats"></nav>
      <section id="routines" data-sid="routines" data-title="Scheduled routines (ask first, run on tap)"></section>
    </div>
  </div>
</aside>
<main data-sid="conversation" data-title="Conversation">
  <section id="projects" data-sid="projects" data-title="Projects: start and follow multi-sided projects"></section>
  <section id="settings" data-sid="settings" data-title="Settings: what is set up and what is turned on"></section>
  <section id="guide" data-sid="guide" data-title="Guide: how to use the console, short answers per task"></section>
  <div id="pbar" data-guide="pbar" data-sid="project-bar" data-title="Project bar: back to the project and its other conversations" hidden></div>
  <header id="head" dir="auto"></header>
  <div id="ctxscrim" hidden></div>
  <div id="ctxpanel" role="dialog" aria-label="Context window" data-i18n-aria-label="ctx.title" hidden></div>
  <div id="banner" hidden><span></span><button type="button" id="resume" data-i18n="conv.resume">Resume</button></div>
  <div id="pins" data-sid="pins" data-title="Pinned: questions, links and errors waiting for the user" hidden></div>
  <section id="log" aria-live="polite"></section>
  <p id="readonly" role="note" hidden><span data-i18n="conv.readonly">Read-only: this run lives on a remote server. Nothing can be sent from here.</span></p>
  <form id="composer" data-sid="composer" data-title="Message composer">
    <div id="quota" role="status" hidden></div>
    <div id="suggest" aria-label="Suggested replies" data-i18n-aria-label="composer.suggestions" hidden></div>
    <!-- contenteditable, not a textarea: Android keyboards (Gboard) can commit an image only into an editable element; app.js keeps it plain text -->
    <div id="text" data-guide="reply" contenteditable="true" role="textbox" aria-multiline="true" dir="auto" spellcheck="true" placeholder="Message this seat. Enter sends, Shift+Enter adds a line." aria-label="Message this seat. Enter sends, Shift+Enter adds a line." data-i18n-placeholder="composer.placeholder" data-i18n-aria-label="composer.placeholder"></div>
    <div id="thumbs" hidden></div>
    <div class="row">
      <button type="button" id="projchip" data-guide="folder" title="The project folder this new chat opens in" data-i18n-title="composer.projectTitle" data-i18n="composer.projectAuto" hidden>Project: auto</button>
      <input id="cwd" dir="ltr" aria-label="Working folder" data-i18n-aria-label="composer.folder" placeholder="Folder (empty: by project)" data-i18n-placeholder="composer.folderPh" spellcheck="false">
      <select id="mode" data-guide="mode" aria-label="Permission mode" data-i18n-aria-label="composer.mode"><option value="auto" data-i18n="mode.auto">auto</option><option value="ask" data-i18n="mode.ask">ask</option><option value="bypass" data-i18n="mode.bypass">bypass</option></select>
      <select id="model" data-guide="model" aria-label="Model" data-i18n-aria-label="composer.model"><option value="" data-i18n="composer.defaultModel">default model</option><option value="claude-opus-5-5">Opus 5.5</option><option value="claude-fable-5-1">Fable 5.1</option><option value="claude-sonnet-5-5">Sonnet 5.5</option><option value="claude-haiku-5-5">Haiku 5.5</option><optgroup label="More models" data-i18n-label="composer.moreModels"><option value="claude-haiku-4-5">Haiku 4.5</option><option value="claude-sonnet-5">Sonnet 5</option><option value="claude-opus-5">Opus 5</option><option value="claude-fable-5">Fable 5</option><option value="claude-opus-4-8">Opus 4.8</option><option value="claude-opus-4-7">Opus 4.7</option><option value="claude-opus-4-6">Opus 4.6</option><option value="claude-sonnet-4-6">Sonnet 4.6</option></optgroup></select>
      <label class="effort" data-guide="effort"><span data-i18n="composer.effort">effort</span> <input id="effort" type="range" min="0" max="6" step="1" value="0" aria-label="Effort" data-i18n-aria-label="composer.effort"> <output id="effortOut" data-i18n="composer.effortDefault">default</output></label>
      <button type="button" id="attach" data-guide="attach" title="Attach images or files" data-i18n-title="composer.attachTitle" data-i18n="composer.attach">Attach</button><button type="button" id="pasteimg" title="Paste an image from the clipboard" data-i18n-title="composer.pasteImageTitle" data-i18n="composer.pasteImage" hidden>Paste image</button><input type="file" id="file" multiple hidden><button type="button" id="photobtn" title="Pick photos and screenshots" data-i18n-title="composer.photoTitle" data-i18n="composer.photo" hidden>Photo</button><input type="file" id="photo" accept="image/*" multiple hidden>
      <button type="button" id="stop" data-guide="stop" data-i18n="composer.stop">Stop</button>
      <button type="submit" id="go" class="primary" data-i18n="composer.send">Send</button>
    </div>
  </form>
</main>
<dialog id="mvproj" data-sid="move-project" data-title="Move to project: pick the project a conversation is listed under" aria-label="Move to project" data-i18n-aria-label="conv.moveTitle"></dialog>
<div id="scrim" onclick="document.body.classList.remove('drawer')"></div>
<script src="/paths.js"></script>
<script src="/imgedit.js"></script>
<script src="/tour.js"></script>
<script src="/app.js"></script>
</body>
</html>
